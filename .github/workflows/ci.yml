name: CI

# Every pull request must pass these checks before it can merge, and they run again on each commit the merges make
# on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv has no major-version tags
        with:
          python-version: "3.12"
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    # Tests use temporary vaults and a temporary ORBIT_HOME, and no network. Coverage must stay at 100%.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # a hung install or test fails here instead of after GitHub's 6 hours
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv has no major-version tags
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q --cov

  package:
    # Builds the package and checks it as PyPI and users will see it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv has no major-version tags
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and run both commands
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/orbit --version
          /tmp/clean/bin/orbit-crm --version
      - name: Check that the installed package creates a vault, Bases views included
        run: |
          /tmp/clean/bin/orbit init /tmp/vault --name Test
          test -f /tmp/vault/95_Bases/People.base
