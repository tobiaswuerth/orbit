[build-system]
requires = ["uv_build>=0.11.6,<0.14"]
build-backend = "uv_build"

[project]
name = "orbit-crm"
version = "0.8.0"
description = "Personal CRM MCP server: AI agents keep your network as an Obsidian vault of plain Markdown notes. People, organizations, emails and meetings, tasks and topics, with duplicate detection, email threads and a source for every fact. Local-first: no cloud, no LLM inside."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tobias Würth" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "watchfiles>=1.0",  # picks up edits made in Obsidian while the server runs
    "filelock>=3.16",  # one orbit process per vault
    # what orbit imports itself, though mcp brings them too: the HTTP server and its event loop, and the parameter
    # schemas of the MCP tools
    "uvicorn>=0.31",
    "starlette>=0.48",  # the app that serves the endpoints together
    "anyio>=4.9",
    "pydantic>=2.12",
]
keywords = [
    "personal-crm",
    "crm",
    "contact-management",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "obsidian",
    "obsidian-md",
    "markdown",
    "pkm",
    "knowledge-base",
    "ai-agents",
    "llm",
    "claude",
    "email",
    "entity-resolution",
    "deduplication",
    "local-first",
    "sqlite",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Natural Language :: English",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/tobiaswuerth/orbit"
Documentation = "https://github.com/tobiaswuerth/orbit#readme"
Source = "https://github.com/tobiaswuerth/orbit"
Issues = "https://github.com/tobiaswuerth/orbit/issues"
Changelog = "https://github.com/tobiaswuerth/orbit/blob/main/CHANGELOG.md"

[project.scripts]
orbit = "orbit.cli:main"
orbit-crm = "orbit.cli:main"  # so that `uvx orbit-crm ...` works: uvx runs the command named like the package

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "pyyaml>=6",  # the full YAML parser the tests check orbit's front matter against
    "ruff>=0.15",
    "pre-commit>=4",
]

[tool.uv.build-backend]
module-name = "orbit"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "PT", "RUF", "PERF"]
ignore = [
    "B905",  # zip() without strict=
    "SIM905",  # a word list as one split string reads better than a long list literal
    "RUF001",  # "–" and "·" are part of the note format
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"  # @pytest.mark.parametrize("a, b", ...)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = ["error"]  # a warning today is a failure tomorrow
timeout = 60  # a test that hangs fails instead

[tool.coverage.run]
source = ["orbit"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.codespell]
ignore-words-list = "ue,sie,ist,feld,modul,januar,vor"  # ü written as ue, and German in test notes and generated names
